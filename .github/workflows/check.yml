name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: syntax + sample conversion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check
        run: |
          for file in js/lib/*.js js/ui/*.js; do
            node --check "$file"
          done

      - name: Convert the shipped sample in node
        run: |
          node <<'JS'
          const fs = require("fs");
          for (const module of ["common", "hands", "actions", "pio", "schema", "parser", "gto2pio"]) {
            require(`./js/lib/${module}.js`);
          }
          const core = globalThis.GTO2PIO;
          const fail = (message) => { console.error("FAIL: " + message); process.exit(1); };
          const same = (actual, expected, label) => {
            if (actual !== expected) fail(`${label}: got ${actual}, expected ${expected}`);
          };

          same(core.PIO_ORDER.length, 169, "169 hand classes");
          same(core.gwHandOrder(169).slice(0, 4).join(","), "22,32o,32s,33", "GTO Wizard hand order");

          const payload = fs.readFileSync("samples/gw_action_solutions.json", "utf8");
          const result = core.analyze(payload);
          same(result.detection.format_id, "gw_action_solutions", "detected format");
          same(result.detection.hand_count, 169, "hands");
          same(result.stats.combos, 150.8, "combos");
          same(result.stats.percent, 11.37, "percent");
          same(result.range_text.startsWith("AA,KK,QQ,JJ,TT,"), true, "range prefix");
          same(result.warnings.length, 0, "no warnings for a well-formed payload");
          same(result.grid && Object.keys(result.grid).length, 169, "13x13 grid");

          let threw = false;
          try { core.analyze('{"hello": "world"}'); } catch (error) {
            threw = error instanceof core.ParseError && Boolean(error.diagnostics);
          }
          if (!threw) fail("an unrecognised payload should raise ParseError with diagnostics");

          // the aggregated report: F / C / R31.5 / RAI stay separate actions
          const aggregated = core.analyze(JSON.stringify({ hands: {
            "53o": { name: "53o", total_combos_available: 12, total_combos: 12, total_frequency: 1,
                     actions_total_combos: { F: 12, C: 0, "R31.5": 0, RAI: 0 } },
            "AKs": { name: "AKs", total_combos_available: 8, total_combos: 8, total_frequency: 1,
                     actions_total_combos: { F: 0, C: 2, "R31.5": 6, RAI: 0 } }
          }}), { merge_sizes: false, allin_as_raise: false });
          same(aggregated.detection.format_id, "gw_action_combos", "aggregated combos format");
          same(aggregated.groups.map((group) => group.label).join(","),
            "Fold,Call,Raise 31.5,All-in", "one action per payload key");
          same(aggregated.group_grids["raise:31.5"].AKs, 0.75, "AKs raises 31.5 for 75% of its combos");
          same(aggregated.range_text, "AKs", "only the non-fold actions end up in the range");

          console.log("the converter converts the shipped sample correctly")
          JS
